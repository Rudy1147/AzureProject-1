services:
  db:
    image: postgres:15-alpine
    container_name: postgres_backend
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data

  auth:
    build: ./auth
    container_name: auth_service
    ports:
      - "8001:8000"
    environment:
      DB_HOST: db
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: secret
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      - db

  api:
    build: ./api
    container_name: api_service
    ports:
      - "8002:8000"
    environment:
      DB_HOST: db
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: secret
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: load_balancer
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - api

volumes:
  pgdata: